<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sandkasten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --grund: #1b1410;
    --text: #f3e6d2;
    --leise: #b79d7e;
    --glut: #e9b874;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(120% 80% at 50% 40%, #2a1f17 0%, var(--grund) 70%);
    color: var(--text);
    font-family: "Cormorant Garamond", Georgia, serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .hinweis {
    font-style: italic; font-size: 1.15rem; color: var(--leise);
    margin: 0 0 18px; letter-spacing: .02em;
    transition: opacity 1.2s ease;
  }
  .rahmen {
    position: relative; width: min(100%, 880px); aspect-ratio: 1497 / 998;
    border-radius: 14px; overflow: hidden; flex-shrink: 0;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(233,184,116,.12);
  }
  .rahmen img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: brightness(1.25) saturate(1.05);
  }
  canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    touch-action: none; cursor: grab;
    transition: opacity 1.6s ease;
  }
  .satz {
    margin: 28px 0 0; max-width: 22ch; text-align: center;
    font-size: clamp(1.7rem, 6.5vw, 2.6rem); line-height: 1.2; font-weight: 500;
    opacity: 0; transform: translateY(8px);
    transition: opacity 1.8s ease .6s, transform 1.8s ease .6s;
  }
  .satz em { color: var(--glut); }
  .nochmal {
    margin-top: 26px; background: none; border: 1px solid rgba(233,184,116,.35);
    color: var(--leise); font: italic 1.05rem "Cormorant Garamond", Georgia, serif;
    padding: 8px 18px; border-radius: 999px; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease 2.4s;
  }
  .frei .satz { opacity: 1; transform: none; }
  .frei .hinweis { opacity: 0; }
  .frei canvas { opacity: 0; pointer-events: none; }
  .frei .nochmal { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
  <p class="hinweis">wisch mal ein bisschen</p>
  <div class="rahmen">
    <img id="bild" src="" alt="Ein Holzrahmen voller Sand mit zwei Kissen, einer Decke und einer Laterne im warmen Abendlicht">
    <canvas id="sand"></canvas>
  </div>
  <p class="satz">Hier darf man <em>rumw(f)ühlen</em>, nichts geht kaputt.</p>
  <button class="nochmal" type="button">nochmal zuschütten</button>

<script>
(() => {
  const canvas = document.getElementById('sand');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const body = document.body;
  let breite, hoehe, dpr, aktiv = false, letzter = null, striche = 0;

  function sandAufschuetten() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const box = canvas.getBoundingClientRect();
    breite = box.width; hoehe = box.height;
    canvas.width = Math.round(breite * dpr);
    canvas.height = Math.round(hoehe * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';

    const verlauf = ctx.createLinearGradient(0, 0, breite, hoehe);
    verlauf.addColorStop(0, '#d8bb8a');
    verlauf.addColorStop(.55, '#c7a46f');
    verlauf.addColorStop(1, '#a9844f');
    ctx.fillStyle = verlauf;
    ctx.fillRect(0, 0, breite, hoehe);

    // Rippeln wie vom Wind
    for (let i = 0; i < 26; i++) {
      const y0 = (i / 26) * hoehe * 1.1;
      ctx.beginPath();
      for (let x = 0; x <= breite; x += 6) {
        const y = y0 + Math.sin(x / 38 + i * 1.7) * 5 + Math.sin(x / 97 + i) * 7;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = i % 2 ? 'rgba(255,240,210,.18)' : 'rgba(110,80,40,.14)';
      ctx.lineWidth = 2.2;
      ctx.stroke();
    }

    // Körnung
    const koerner = Math.round(breite * hoehe / 9);
    for (let i = 0; i < koerner; i++) {
      const hell = Math.random() < .5;
      ctx.fillStyle = hell ? 'rgba(255,245,225,' + (Math.random() * .35) + ')'
                           : 'rgba(90,60,30,' + (Math.random() * .3) + ')';
      ctx.fillRect(Math.random() * breite, Math.random() * hoehe, 1.1, 1.1);
    }
  }

  function wischen(x, y) {
    ctx.globalCompositeOperation = 'destination-out';
    const r = Math.max(26, breite * .055);
    const von = letzter || { x, y };
    const abstand = Math.hypot(x - von.x, y - von.y);
    const schritte = Math.max(1, Math.ceil(abstand / (r / 3)));
    for (let i = 0; i <= schritte; i++) {
      const px = von.x + (x - von.x) * i / schritte;
      const py = von.y + (y - von.y) * i / schritte;
      const pinsel = ctx.createRadialGradient(px, py, 0, px, py, r);
      pinsel.addColorStop(0, 'rgba(0,0,0,1)');
      pinsel.addColorStop(.6, 'rgba(0,0,0,.85)');
      pinsel.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = pinsel;
      ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
    }
    letzter = { x, y };
    if (++striche % 12 === 0) pruefen();
  }

  function pruefen() {
    const daten = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const raster = 12 * dpr;
    let frei = 0, gesamt = 0;
    for (let y = 0; y < canvas.height; y += raster) {
      for (let x = 0; x < canvas.width; x += raster) {
        gesamt++;
        if (daten[(Math.floor(y) * canvas.width + Math.floor(x)) * 4 + 3] < 60) frei++;
      }
    }
    if (frei / gesamt > .55) body.classList.add('frei');
  }

  function punkt(e) {
    const box = canvas.getBoundingClientRect();
    return { x: e.clientX - box.left, y: e.clientY - box.top };
  }

  canvas.addEventListener('pointerdown', e => {
    aktiv = true; letzter = null;
    canvas.setPointerCapture(e.pointerId);
    const p = punkt(e); wischen(p.x, p.y);
  });
  canvas.addEventListener('pointermove', e => {
    if (!aktiv) return;
    const p = punkt(e); wischen(p.x, p.y);
  });
  const ende = () => { aktiv = false; letzter = null; pruefen(); };
  canvas.addEventListener('pointerup', ende);
  canvas.addEventListener('pointercancel', ende);

lem Steinboden zwischen einem Becken und einer Saunatür im warmen Abendlicht' }
  ];
  let runde = 0;
  const bild = document.getElementById('bild');

  document.querySelector('.nochmal').addEventListener('click', () => {
    // Sand sofort deckend, sonst blitzt das neue Bild beim Einblenden durch
    canvas.style.transition = 'none';
    body.classList.remove('frei');
    void canvas.offsetWidth;
    canvas.style.transition = '';
    runde = (runde + 1) % bilder.length;
    bild.src = bilder[runde].src; bild.alt = bilder[runde].alt;
    striche = 0;
    sandAufschuetten();
  });

  let zuletztBreite = 0;
  window.addEventListener('resize', () => {
    const b = canvas.getBoundingClientRect().width;
    if (Math.abs(b - zuletztBreite) > 2 && !body.classList.contains('frei')) {
      zuletztBreite = b; sandAufschuetten();
    }
  });

  bild.src = bilder[0].src;
  sandAufschuetten();
  zuletztBreite = breite;
})();
</script>
